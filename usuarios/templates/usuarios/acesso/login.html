{% extends 'base.html' %}

{% block title %}Entrar | RondoPesca{% endblock %}

{% block content %}
<section class="login-page">
    <div class="login-card shadow-sm p-4 p-md-5">
        <div class="text-center mb-4">
            <h1 class="h3 fw-bold mb-2">Entrar</h1>
            <p class="text-muted mb-0">Acesse sua conta RondoPesca</p>
        </div>

        <form method="post" class="login-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 py-2 mt-2">Entrar</button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            <a class="link-success text-decoration-none" href="{% url 'home' %}">Voltar ao início</a>
        </p>
    </div>
</section>
{% endblock %}
