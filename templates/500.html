{% extends "base.html" %}

{% block title %}Erro interno | RondoPesca{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 680px;">
        <div class="card-body p-5 text-center">
            <h1 class="display-5 fw-bold text-danger">500</h1>
            <h2 class="h4">Não foi possível concluir a operação</h2>
            <p class="text-muted mt-3">
                Ocorreu um erro interno no servidor. Tente novamente ou volte ao início.
            </p>
            <a class="btn btn-success mt-2" href="/">Voltar ao início</a>
        </div>
    </div>
</div>
{% endblock %}
